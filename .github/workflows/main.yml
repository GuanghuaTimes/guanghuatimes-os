name: Deploy to Aliyun OSS

on:
  push:
    branches:
      - main  # 确保这里是您的主分支名称

jobs:
  build:
    # 运行环境
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' # 替换为您的项目所需的 Node.js 版本

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build # 替换为您的项目构建命令

      # 假设使用阿里云 OSS CLI 或类似的 Actions 进行部署
      - name: Deploy to Aliyun OSS
        # 替换为实际的部署 Action 或自定义脚本
        run: echo "Deployment script goes here" 
        # 例如：OSS-specific deployment action or rsync command
